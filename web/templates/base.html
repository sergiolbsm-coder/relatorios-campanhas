<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Relatórios de Campanhas{% endblock %}</title>
  <style>
    :root { --orange: #F4762A; --dark: #1C1C1E; --bg: #FAFAFA; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--dark); margin: 0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card {
      background: white; border-radius: 12px; padding: 32px 36px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08); width: 100%; max-width: 440px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.subtitle { color: #777; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 4px; }
    input[type=password], input[type=text], select {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: var(--orange); color: white; border: none; border-radius: 8px;
      padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
      width: 100%; margin-top: 20px;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { background: #FDECEA; color: #B3261E; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    a.logout { display: block; text-align: center; margin-top: 18px; font-size: 12px; color: #999; text-decoration: none; }
    .brand-list a {
      display: block; padding: 10px 14px; border: 1px solid #eee; border-radius: 8px;
      margin-bottom: 8px; text-decoration: none; color: var(--dark); font-size: 14px;
    }
    .brand-list a.active { border-color: var(--orange); background: #FFF4EC; }
    #spinner { display: none; text-align: center; margin-top: 14px; font-size: 13px; color: #777; }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>

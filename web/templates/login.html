{% extends "base.html" %}
{% block title %}Login — Relatórios de Campanhas{% endblock %}
{% block content %}
  <h1>Relatórios de Campanhas</h1>
  <p class="subtitle">Digite a senha de acesso (equipe ou cliente)</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autofocus required>
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
